<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Western Province Hidden Gems</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for sleek icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Modern CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">
            <div class="logo-icon"><i class="fa-solid fa-map-location-dot"></i></div>
            <h1>Sri Lanka Hidden Gems <span>Western Province</span></h1>
        </div>
        <div class="nav-actions">
            <button id="nav-add-btn" class="btn-primary">
                <i class="fa-solid fa-location-crosshairs"></i> Map a Destination
            </button>
        </div>
    </nav>

    <div class="main-content">
        <!-- Floating Glassmorphism Control Panel -->
        <div class="floating-panel minimized" id="floating-panel">
            <button id="toggle-panel-btn" class="panel-toggle">
                <i class="fa-solid fa-filter"></i> <span>Explore Categories</span>
            </button>
            
            <div class="panel-content">
                <div class="panel-section">
                    <div class="custom-select-wrapper">
                        <select id="category-filter" class="custom-select">
                            <option value="all">🌍 All Destinations</option>
                            <option value="nature">🍃 Nature & Outdoors</option>
                            <option value="culture">🏛️ Culture & Heritage</option>
                            <option value="adventure">🧗 Adventure Trails</option>
                            <option value="food">🍛 Local Culinary Spots</option>
                        </select>
                    </div>
                </div>

                <div class="panel-section stats-box">
                    <div class="stat-icon"><i class="fa-solid fa-users-viewfinder"></i></div>
                    <div class="stat-text">
                        <span class="stat-title">Community Discovered</span>
                        <span class="stat-value" id="total-count">0</span>
                    </div>
                </div>

                <div class="panel-section help-text">
                    <p><strong><i class="fa-solid fa-lightbulb"></i> How to map:</strong> Click anywhere on the map or use the top button to anonymously share a hidden spot with the community.</p>
                </div>
            </div>
        </div>

        <!-- Fullscreen Map Container -->
        <div id="map"></div>
    </div>

    <!-- Redesigned Modern Modal -->
    <div id="add-modal" class="modal hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Add a New Discovery</h2>
                <button class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <p class="modal-subtitle">Help tourists explore the unexplored. Your submission will be shared anonymously.</p>
                <form id="add-asset-form">
                    <input type="hidden" id="lat" name="lat">
                    <input type="hidden" id="lng" name="lng">
                    
                    <div class="input-group">
                        <label for="asset-name">Location Name</label>
                        <input type="text" id="asset-name" required placeholder="e.g., Secret Kalutara Waterfall">
                    </div>

                    <div class="input-group">
                        <label for="asset-category">Category</label>
                        <select id="asset-category" required>
                            <option value="nature" selected>🍃 Nature & Outdoors</option>
                            <option value="culture">🏛️ Culture & Heritage</option>
                            <option value="adventure">🧗 Adventure Trails</option>
                            <option value="food">🍛 Local Culinary Spots</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="asset-desc">Description</label>
                        <textarea id="asset-desc" rows="3" required placeholder="What makes this place special? How can others find it?"></textarea>
                    </div>

                    <div class="input-group">
                        <label for="asset-photo">Upload Photo (Optional)</label>
                        <input type="file" id="asset-photo" accept="image/png, image/jpeg, image/webp" class="file-input">
                    </div>

                    <button type="submit" class="btn-primary full-width">
                        <i class="fa-solid fa-paper-plane"></i> Publish to Map
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Supabase JS SDK (Database) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Custom JS -->
    <script src="assets/js/map.js"></script>
</body>
</html>
